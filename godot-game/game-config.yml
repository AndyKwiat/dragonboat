# Game configuration, read once at launch (src/core/GameConfig.cs).
# Every key is required — nothing here has a code default.

# Terrain file exported by ../terrain-gen (TGN1, raw or gzipped), relative
# to this folder. One map cell = one world unit (~1 m).
terrainFile: map1.terrain

# Cities generated on the coast each launch (10% large, 30% medium, the
# rest small). Story-event counts scale with this number (base: 100 cities).
cityCount: 30
