# Game configuration, read once at launch (src/core/GameConfig.cs).
# Every key is required — nothing here has a code default.

# Terrain file exported by ../terrain-gen (TGN1, raw or gzipped), relative
# to this folder. One map cell = one world unit (~1 m).
terrainFile: map1.terrain

# Current arrows per map area: 100 is the baseline (3600 arrows on an
# 8192x8192 map), 200 twice as thick, 10 a tenth, 0 none.
currentDensity: 10

# Cities generated on the coast each launch, by size — the mix is yours to
# set, there is no ratio in the code. Footprints are 60x60 small, 100x100
# medium, 140x140 large; large ones are placed first (they need the most
# room), and every city needs MinSpacing (300) cells of clearance, so a
# crowded map will fail loudly rather than pile them up.
smallCities: 18
mediumCities: 18
largeCities: 5

# Story events the world holds at any one time, by kind; when one lapses a
# fresh one is rolled elsewhere so the count holds. 0 means none of that
# kind ever spawns.
priceEvents: 0 # //20   # supply shocks: one product suddenly dear or cheap in a city
vipEvents: 4      # VIP passengers waiting for passage to another city
