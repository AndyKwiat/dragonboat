# Gunnery test — run it with `./run.sh -- --scenario=gunnery`.
#
# One AI boat, lying to on the same marker the player starts on, so a
# scripted --fire can be aimed at a hull that is not going anywhere. This
# exists because an AI boat was once invisible to cannon fire: it had the hit
# box, but nothing had registered it with the combat system, so shells sailed
# through and splashed in the water beyond — which looks exactly like a hit
# and is not one (docs/ai.md).
#
#   ./run.sh -- --scenario=gunnery --start=229,625,0 --sails=down \
#              --fire=40,0@15 --frames=150 --mode=free --center=269,625 --zoom=8
#
# ...must end its printed line with `shots 1 hits 1`. Aim 30 units short
# (--fire=10,0@15) and it must say `hits 0`.

terrain: pathingTest.terrain

cities: false
currents: false
enemyFleet: false

player: p0
boats: p0            # an idle AI boat on top of the player's own marker
ai: idle
