# Pathing test scenario — run it with ./pathingTest.sh (or --scenario=pathing).
#
# A bare world for developing the boat AI (docs/ai.md): the small hand-painted
# pathingTest map, no cities, no currents and no hostile fleet, so the only
# things moving on the water are the boats under test. Marker tags come from
# the map itself (painted in ../terrain-gen); see docs/scenarios.md.

terrain: pathingTest.terrain

cities: false        # no coastal cities, no economy, no docking
currents: false      # nothing pushing a boat off its course but its own helm
enemyFleet: false    # the world's own hostile fleet stays out of the way

player: p0                        # the player boat starts on this marker
# One AI boat per marker: `tag[:state[>destination]]`. These two make the
# same passage in opposite directions, so they pass each other on the way.
boats: p1:voyage>p2, p2:voyage>p1
ai: idle                          # the state for a boat that names none
