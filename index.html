<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Boat - Island Map</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
    }
    #map-container {
      width: 1000px;
      height: 1000px;
      position: relative;
    }
    canvas {
      display: block;
    }
    #export-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 8px 16px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      z-index: 10;
    }
    #export-btn:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div id="map-container">
    <button id="export-btn">Export Map</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
