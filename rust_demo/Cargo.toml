[package]
name = "voxel_demo"
version = "0.1.0"
edition = "2021"
description = "Rust + Bevy voxel demo compiled to WebAssembly and rendered with browser WebGPU"

[dependencies]
bevy = "0.19"

[features]
default = []
# Enable Bevy's WebGPU backend for wasm builds.
# Bevy's `webgpu` feature takes precedence over the default `webgl2` feature.
webgpu = ["bevy/webgpu"]

# Fast-enough dev builds: optimize dependencies (Bevy) even in dev mode.
# debug = false strips debuginfo, which is most of the wasm binary — it cuts
# the dev .wasm dramatically, and wasm-bindgen + browser load time with it.
# Flip to true (or "line-tables-only") temporarily if you need backtraces.
[profile.dev]
opt-level = 1
debug = false
strip = "symbols"

[profile.dev.package."*"]
opt-level = "s"

# Reasonable wasm release output.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
